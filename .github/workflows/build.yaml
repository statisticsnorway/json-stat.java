name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '1.8', '17' ]

    name: Build on Java ${{ matrix.java }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v1

      - name: Set up java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress --file pom.xml package
