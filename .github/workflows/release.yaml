name: Release

on:
  release:
    types: [ created ]

jobs:
  release:
    runs-on: ubuntu-latest

    name: Release on Java 11
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'
          cache: 'maven'
          server-id: ossrh
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Resolve version
        run: |
          if [[ $GITHUB_REF == *"tags"* ]]; then
            RELEASE_VERSION=${GITHUB_REF#refs/tags/}
          else
            RELEASE_VERSION=${GITHUB_REF#refs/heads/}-SNAPSHOT
          fi
      - name: Set version with Maven
        run: mvn versions:set --no-transfer-progress -DnewVersion=$RELEASE_VERSION
#      - name: Deploy with Maven
#        run: mvn clean deploy -P build-javadoc-and-sources,release --batch-mode --no-transfer-progress
